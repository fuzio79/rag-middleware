name: release

# Publish a prebuilt, digest-able image to GHCR when a version tag is pushed.
#
# ---------------------------------------------------------------------------
# Scope: this is for CONSUMERS of the public repo, not for the LAN deployment.
# ---------------------------------------------------------------------------
#
# The LAN never uses this. `docker-compose.yml` in the stack repo builds and
# runs `rag-middleware:latest` locally, and `scripts/build.sh` builds it from
# source. Nothing in that deployment pulls from ghcr.io.
#
# What this gives the public repo instead:
#   * anyone can `docker pull ghcr.io/fuzio79/rag-middleware:v0.1.1` without
#     spending twenty minutes building torch on CPU;
#   * the tag matches the snapshot, so a published version has a real artefact.
#
# ---------------------------------------------------------------------------
# amd64 ONLY, deliberately
# ---------------------------------------------------------------------------
#
# This previously built linux/amd64 + linux/arm64. That never finished: the
# arm64 half runs under QEMU emulation, and this image installs
# sentence-transformers and CPU torch (~2.8 GB). Two runs sat at
# "Build and push" for over 20 minutes and had to be cancelled.
#
# Adding arm64 back is a build-minutes decision, not a config tweak. If it is
# ever wanted, build it on a native arm64 runner (e.g. a matrix with
# `runs-on: ubuntu-24.04-arm`) rather than under emulation.
on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build (e.g. v0.1.1)"
        required: true

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          # workflow_dispatch must build the tag the caller named, not the
          # default branch.
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Resolve image name and tag
        id: meta
        run: |
          # GHCR requires a lowercase repository path; the owner may not be.
          IMAGE="${REGISTRY}/${GITHUB_REPOSITORY,,}"
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "building ${IMAGE}:${TAG} (linux/amd64)"

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}
            ${{ steps.meta.outputs.image }}:latest
          labels: |
            org.opencontainers.image.title=rag-middleware
            org.opencontainers.image.description=Self-hosted RAG service for Open WebUI
            org.opencontainers.image.licenses=MIT
            org.opencontainers.image.version=${{ steps.meta.outputs.tag }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke-test the published image
        # Pull what was actually pushed and confirm it starts and serves
        # /health. Catches a broken CMD or a missing module before anyone
        # consumes the tag.
        run: |
          set -eu
          IMAGE="${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}"
          docker run -d --name smoke -e RAG_API_KEY=smoke-test-key -p 8000:8000 "$IMAGE"
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8000/health; then
              echo "healthy after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "::error::image did not answer /health within 60s"
          docker logs smoke
          exit 1

      - name: Dump container logs on failure
        if: failure()
        run: docker logs smoke || true
